<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuzumeBachiBlowdart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 36px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .button:hover {
            transform: translateY(-2px);
        }
        .primary {
            background: #667eea;
            color: white;
        }
        .secondary {
            background: #e5e7eb;
            color: #333;
        }
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SuzumeBachiBlowdart</h1>
        <p>自動株価予測・取引推奨システム</p>
        
        <p>毎日10銘柄の価格を予測し、高信頼度のシグナルのみを自動抽出します。</p>
        
        <div>
            <a href="dashboard.html" class="button primary">📊 ダッシュボード</a>
            <a href="https://github.com/KG-NINJA/SuzumeBachiBlowdart" class="button secondary">📖 GitHub</a>
        </div>
        
        <div class="footer">
            <p>Phase 1: 信頼度フィルタ | Phase 2: 市場環境分析 | Phase 3: バックテスト</p>
            <p>毎日自動実行 | GitHub Actions統合</p>
        </div>
    </div>
</body>
</html>
