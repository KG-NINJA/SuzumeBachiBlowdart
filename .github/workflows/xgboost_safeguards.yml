name: XGBoost Leakage Safeguards

on:
  pull_request:
    paths:
      - "xgboost_tuning.py"
      - "tests/test_xgboost_tuning.py"
      - ".github/workflows/xgboost_safeguards.yml"
      - ".github/workflows/xgboost_tuning.yml"
      - ".github/workflows/phase2_pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leakage-safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pandas==2.1.3 \
            numpy==1.26.4 \
            scikit-learn==1.3.2 \
            xgboost==1.7.6

      - name: Run leakage regression tests
        run: python -m pytest tests/test_xgboost_tuning.py
