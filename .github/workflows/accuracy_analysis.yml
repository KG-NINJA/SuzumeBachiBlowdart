name: Accuracy Analysis - GOOGL vs Others

on:
  schedule:
    # 毎週日曜日の0時に実行（精度分析）
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  accuracy-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xgboost scikit-learn matplotlib seaborn scipy yfinance

      - name: Run daily prediction (generate models)
        run: python simple_daily_prediction.py

      - name: Generate analysis report
        run: python analyze_and_report.py

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-analysis-results
          path: |
            accuracy_analysis/
            analytics/

      - name: Commit analysis results to repo
        run: |
          git config user.name "Blowdart Bot"
          git config user.email "bot@blowdart.local"
          git add -A accuracy_analysis/ analytics/
          git commit -m "📊 Accuracy analysis - $(date +%Y-%m-%d)" || true
          git push

      - name: Create GitHub Issue with findings
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            try {
              const analysisResults = JSON.parse(fs.readFileSync('accuracy_analysis/analysis_results.json', 'utf8'));
              
              const accuracies = analysisResults.accuracy_by_ticker.sort((a, b) => b.accuracy - a.accuracy);
              const highest = accuracies[0];
              const lowest = accuracies[accuracies.length - 1];
              
              const topThreeList = accuracies.slice(0, 3)
                .map((a, i) => i + 1 + '. **' + a.ticker + '**: ' + (a.accuracy * 100).toFixed(2) + '%')
                .join('\n');
              
              const avgAcc = (analysisResults.accuracy_by_ticker.reduce((a, b) => a + b.accuracy, 0) / analysisResults.accuracy_by_ticker.length * 100).toFixed(2);
              
              const issueTitle = '📊 Accuracy Analysis - ' + new Date().toISOString().split('T')[0];
              
              const issueBody = '## 🎯 Weekly Accuracy Analysis Report\n\n' +
                '### Top Performers\n' +
                topThreeList + '\n\n' +
                '### Needs Improvement\n' +
                '- **' + lowest.ticker + '**: ' + (lowest.accuracy * 100).toFixed(2) + '% accuracy\n\n' +
                '### Key Insights\n' +
                '- Average Accuracy: ' + avgAcc + '%\n' +
                '- Check `accuracy_analysis/analysis_results.json` for full details\n' +
                '- See `accuracy_analysis/REPORT.md` for detailed recommendations\n\n' +
                '### Why is ' + highest.ticker + ' so accurate?\n' +
                highest.ticker + ' is outperforming with ' + (highest.accuracy * 100).toFixed(2) + '% accuracy.\n\n' +
                '**Key factors to replicate on other tickers:**\n' +
                '- Analyze feature importance in ' + highest.ticker + ' model\n' +
                '- Check for unique characteristics in price patterns\n' +
                '- Consider ticker-specific hyperparameter tuning\n\n' +
                '---\n' +
                'Generated: ' + new Date().toISOString();
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['analytics', 'model-performance']
              });
              
              console.log('✓ GitHub Issue created successfully');
            } catch (error) {
              console.log('⚠️ Could not create issue:', error.message);
            }
