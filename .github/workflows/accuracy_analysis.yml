name: Daily Prediction with Confidence Filter

on:
  schedule:
    # 毎日午前9時（JST = UTC 0時）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xgboost scikit-learn matplotlib seaborn scipy yfinance

      - name: Run daily prediction (generate models)
        run: python simple_daily_prediction.py

      - name: Apply confidence filter
        run: python confidence_filter.py

      - name: Generate analysis report
        run: python analyze_and_report.py

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: daily-predictions-${{ github.run_id }}
          path: |
            daily_predictions/
            analytics/

      - name: Commit results to repository
        run: |
          git config user.name "SuzumeBachiBot"
          git config user.email "bot@blowdart.local"
          git add -A daily_predictions/ analytics/
          git commit -m "🤖 Daily predictions & confidence analysis - $(date '+%Y-%m-%d %H:%M:%S UTC')" || true
          git push

      - name: Create GitHub Issue with summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const analysisFile = 'daily_predictions/confidence_report.json';
              if (!fs.existsSync(analysisFile)) {
                console.log('No analysis file found');
                return;
              }
              
              const report = JSON.parse(fs.readFileSync(analysisFile, 'utf8'));
              const total = report.total_predictions;
              const execute = report.actions.execute;
              const skip = report.actions.skip;
              
              let topTicker = '';
              let topAccuracy = 0;
              for (const [ticker, data] of Object.entries(report.by_ticker)) {
                if (data.model_accuracy > topAccuracy && data.action === 'EXECUTE') {
                  topAccuracy = data.model_accuracy;
                  topTicker = ticker;
                }
              }
              
              const executeTrades = Object.entries(report.by_ticker)
                .filter(([_, data]) => data.action === 'EXECUTE')
                .map(([ticker, data]) => {
                  const direction = data.direction.includes('Bearish') ? '📉' : '📈';
                  return `- **${ticker}** ${direction} | Conf: ${(data.confidence*100).toFixed(2)}% | Acc: ${(data.model_accuracy*100).toFixed(2)}%`;
                })
                .join('\n');
              
              const skipTrades = Object.entries(report.by_ticker)
                .filter(([_, data]) => data.action === 'SKIP')
                .map(([ticker, _]) => `- **${ticker}** | Reason: Low confidence`)
                .join('\n');
              
              const dateStr = new Date().toISOString().split('T')[0];
              const topTradeStr = topTicker ? `**${topTicker}** - Accuracy: ${(topAccuracy*100).toFixed(2)}% | Confidence: ${(report.by_ticker[topTicker].confidence*100).toFixed(2)}%` : 'N/A';
              
              const body = `## 📊 Daily Prediction Report\n\n**Date:** ${dateStr}\n\n### Summary\n- **Total Predictions:** ${total}\n- **Execute (High Confidence):** ${execute} 🟢\n- **Skip (Low Confidence):** ${skip} 🔴\n- **Execute Ratio:** ${(execute/total*100).toFixed(1)}%\n\n### Top Recommended Trade\n${topTradeStr}\n\n### Confidence Distribution\n- **Strong:** ${report.confidence_distribution.strong}\n- **Medium:** ${report.confidence_distribution.medium}\n- **Weak:** ${report.confidence_distribution.weak}\n\n### Key Metrics\n- **Avg Confidence:** ${(report.statistics.avg_confidence*100).toFixed(2)}%\n- **Min Confidence:** ${(report.statistics.min_confidence*100).toFixed(2)}%\n- **Max Confidence:** ${(report.statistics.max_confidence*100).toFixed(2)}%\n\n### 🎯 Execution Trades\n${executeTrades}\n\n### ⏸️ Hold Trades\n${skipTrades}\n\n---\n📁 **Files Generated:**\n- filtered_predictions.json\n- confidence_report.json\n- confidence_report.md\n- phase2_analysis.json & md\n- backtest_report.json & md\n\n**All phases active: Phase 1 ✅ | Phase 2 ✅ | Phase 3 ✅**`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Daily Predictions - ${dateStr}`,
                body: body,
                labels: ['predictions', 'automated']
              });
              
              console.log('✅ Issue created successfully');
            } catch (error) {
              console.log('⚠️ Could not create issue: ' + error.message);
            }
