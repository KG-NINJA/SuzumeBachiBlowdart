name: Blowdart ML Predict

on:
  # FROZEN 2026-09-06: scheduled execution paused after repeated price-fetch failure.
  # Restore only after the root cause is verified in an isolated test.
  # schedule:
  #   - cron: "0 8 * * *"   # 17:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      REQUEST_UA: "Mozilla/5.0 (Codex-GitHubRunner)"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifact directories
        run: |
          mkdir -p analytics models daily_predictions docs/data data/cache logs
      - name: Run daily predictions
        run: |
          python simple_daily_prediction.py --mode predict
      - name: Commit and push predictions
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git status --short
          if ! git diff --quiet; then
            git add analytics models daily_predictions docs
            git commit -m "chore: automated prediction artifacts"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
