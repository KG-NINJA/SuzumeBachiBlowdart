name: Blowdart ML Train

on:
  schedule:
    - cron: "0 23 * * *"  # 08:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      REQUEST_UA: "Mozilla/5.0 (Codex-GitHubRunner)"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train XGBoost models
        run: |
          python simple_daily_prediction.py --mode train

      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git status --short
          if ! git diff --quiet; then
            git add analytics models daily_predictions docs
            git commit -m "chore: automated training artifacts"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
