name: Codex Autofix CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  codex-autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_commit.id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex Autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex autofix \
            --prompt-file ".github/codex-autofix-policy.txt" \
            --max-changes 80 \
            --max-files 3 \
            --explain \
            --commit-message "Codex Autofix: Fix CI failure"
