<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SuzumeBachiBlowdart Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .timestamp {
            color: #666;
            font-size: 14px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }
        
        .summary-card.execute {
            border-left-color: #10b981;
        }
        
        .summary-card.skip {
            border-left-color: #ef4444;
        }
        
        .summary-card.best {
            border-left-color: #f59e0b;
        }
        
        .summary-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .summary-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .summary-subtext {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .trades-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        
        .trade-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-top: 4px solid #667eea;
        }
        
        .trade-card.execute {
            border-top-color: #10b981;
        }
        
        .trade-card.skip {
            border-top-color: #ef4444;
            opacity: 0.8;
        }
        
        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .ticker {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .direction {
            font-size: 20px;
            font-weight: bold;
        }
        
        .direction.bullish {
            color: #10b981;
        }
        
        .direction.bearish {
            color: #ef4444;
        }
        
        .trade-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        
        .metric {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
        }
        
        .metric-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .metric-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .action-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 12px;
        }
        
        .action-badge.execute {
            background: #d1fae5;
            color: #065f46;
        }
        
        .action-badge.skip {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 25px 0;
            max-height: 400px;
            position: relative;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 25px 0;
        }
        
        thead {
            background: #f3f4f6;
            border-bottom: 2px solid #e5e7eb;
        }
        
        th {
            padding: 15px;
            text-align: left;
            color: #666;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            color: #333;
        }
        
        tbody tr:hover {
            background: #f9fafb;
        }
        
        .rank {
            font-weight: bold;
            color: #667eea;
        }
        
        .accuracy-high {
            color: #10b981;
            font-weight: bold;
        }
        
        .accuracy-medium {
            color: #f59e0b;
            font-weight: bold;
        }
        
        .accuracy-low {
            color: #ef4444;
            font-weight: bold;
        }
        
        .confidence-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .confidence-strong {
            background: #d1fae5;
            color: #065f46;
        }
        
        .confidence-medium {
            background: #fef3c7;
            color: #92400e;
        }
        
        .confidence-weak {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 20px;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
            
            .trades-container {
                grid-template-columns: 1fr;
            }
            
            .trade-metrics {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 SuzumeBachiBlowdart Dashboard</h1>
            <p class="timestamp">最終更新: <span id="lastUpdate">読み込み中...</span></p>
        </header>
        
        <div id="content">
            <div class="loading">📊 データを読み込み中...</div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                // Load predictions data
                const response = await fetch('./data/latest_predictions.json');
                const predictions = await response.json();
                
                // Load backtest data if available
                let backtest = null;
                try {
                    const backtestResponse = await fetch('./backtest_results/backtest_report.json');
                    if (backtestResponse.ok) {
                        backtest = await backtestResponse.json();
                    }
                } catch (e) {
                    console.log('Backtest data not available');
                }
                
                renderDashboard(predictions, backtest);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('content').innerHTML = 
                    '<div class="loading" style="color: #ff6b6b;">❌ データ読み込みエラー</div>';
            }
        }
        
        function renderDashboard(predictions, backtest) {
            const execute = predictions.filter(p => p.action === 'EXECUTE');
            const skip = predictions.filter(p => p.action === 'SKIP');
            
            let best = 0, good = 0;
            if (backtest && backtest.trade_categories) {
                best = backtest.trade_categories.best_count || 0;
                good = backtest.trade_categories.good_count || 0;
            }
            
            const avgConfidence = (predictions.reduce((sum, p) => sum + p.confidence, 0) / predictions.length * 100).toFixed(2);
            const avgAccuracy = (predictions.reduce((sum, p) => sum + p.model_accuracy, 0) / predictions.length * 100).toFixed(2);
            
            let html = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <h3>📊 総予測</h3>
                        <div class="summary-value">${predictions.length}</div>
                        <div class="summary-subtext">10銘柄の分析</div>
                    </div>
                    
                    <div class="summary-card execute">
                        <h3>✅ 実行推奨</h3>
                        <div class="summary-value">${execute.length}</div>
                        <div class="summary-subtext">${(execute.length/predictions.length*100).toFixed(0)}% 高信頼度</div>
                    </div>
                    
                    <div class="summary-card skip">
                        <h3>⏸️ スキップ</h3>
                        <div class="summary-value">${skip.length}</div>
                        <div class="summary-subtext">${(skip.length/predictions.length*100).toFixed(0)}% 低信頼度</div>
                    </div>
                    
                    <div class="summary-card best">
                        <h3>⭐ 高品質</h3>
                        <div class="summary-value">${best}</div>
                        <div class="summary-subtext">BEST取引</div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>📈 平均信頼度</h3>
                        <div class="summary-value">${avgConfidence}%</div>
                        <div class="summary-subtext">市場のシグナル強度</div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>🎯 平均精度</h3>
                        <div class="summary-value">${avgAccuracy}%</div>
                        <div class="summary-subtext">モデル精度</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">📊 精度分布</div>
                    <div style="height: 300px;"><canvas id="accuracyChart"></canvas></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">💡 信頼度レベル</div>
                    <div style="height: 300px;"><canvas id="confidenceChart"></canvas></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">🎲 アクション分布</div>
                    <div style="height: 300px;"><canvas id="actionChart"></canvas></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">🟢 実行推奨 (高信頼度)</div>
            `;
            
            if (execute.length > 0) {
                html += '<div class="trades-container">';
                execute.forEach(pred => {
                    const direction = pred.direction.includes('Bullish') ? 'bullish' : 'bearish';
                    const directonText = direction === 'bullish' ? '📈 強気' : '📉 弱気';
                    html += `
                        <div class="trade-card execute">
                            <div class="trade-header">
                                <span class="ticker">${pred.ticker}</span>
                                <span class="direction ${direction}">${directonText}</span>
                            </div>
                            <div class="trade-metrics">
                                <div class="metric">
                                    <div class="metric-label">信頼度</div>
                                    <div class="metric-value">${(pred.confidence * 100).toFixed(1)}%</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">精度</div>
                                    <div class="metric-value">${(pred.model_accuracy * 100).toFixed(1)}%</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">現在値</div>
                                    <div class="metric-value">$${pred.current_price.toFixed(2)}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">目標値</div>
                                    <div class="metric-value">$${pred.predicted_price.toFixed(2)}</div>
                                </div>
                            </div>
                            <span class="action-badge execute">✅ 実行</span>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p style="color: #666; text-align: center;">高信頼度のシグナルはありません</p>';
            }
            
            html += `
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>銘柄</th>
                            <th>方向</th>
                            <th>信頼度</th>
                            <th>精度</th>
                            <th>現在値</th>
                            <th>目標値</th>
                            <th>アクション</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            predictions.sort((a, b) => b.model_accuracy - a.model_accuracy).forEach((pred, idx) => {
                const direction = pred.direction.includes('Bullish') ? '📈' : '📉';
                const directionText = pred.direction.includes('Bullish') ? '強気' : '弱気';
                
                let accuracyClass = 'accuracy-low';
                if (pred.model_accuracy > 0.65) accuracyClass = 'accuracy-high';
                else if (pred.model_accuracy > 0.55) accuracyClass = 'accuracy-medium';
                
                let confidenceClass = 'confidence-weak';
                if (pred.confidence_level === 'STRONG') confidenceClass = 'confidence-strong';
                else if (pred.confidence_level === 'MEDIUM') confidenceClass = 'confidence-medium';
                
                const action = pred.action === 'EXECUTE' ? '✅ 実行' : '⏸️ スキップ';
                
                html += `
                    <tr>
                        <td><span class="rank">#${idx + 1}</span></td>
                        <td><strong>${pred.ticker}</strong></td>
                        <td>${direction} ${directionText}</td>
                        <td><span class="confidence-badge ${confidenceClass}">${(pred.confidence * 100).toFixed(1)}%</span></td>
                        <td><span class="${accuracyClass}">${(pred.model_accuracy * 100).toFixed(1)}%</span></td>
                        <td>$${pred.current_price.toFixed(2)}</td>
                        <td>$${pred.predicted_price.toFixed(2)}</td>
                        <td>${action}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
                
                <div class="footer">
                    <p>🚀 SuzumeBachiBlowdart - Automated Trading Prediction System</p>
                    <p>Phase 1: Confidence Filter | Phase 2: Market Analysis | Phase 3: Backtest</p>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ja-JP');
            
            // Create charts
            createCharts(predictions);
        }
        
        function createCharts(predictions) {
            // Accuracy distribution
            const accuracyCtx = document.getElementById('accuracyChart');
            if (accuracyCtx) {
                new Chart(accuracyCtx, {
                    type: 'bar',
                    data: {
                        labels: predictions.map(p => p.ticker),
                        datasets: [{
                            label: 'Model Accuracy',
                            data: predictions.map(p => p.model_accuracy * 100),
                            backgroundColor: predictions.map(p => {
                                if (p.model_accuracy > 0.65) return '#10b981';
                                if (p.model_accuracy > 0.55) return '#f59e0b';
                                return '#ef4444';
                            }),
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, max: 100 }
                        }
                    }
                });
            }
            
            // Confidence level distribution
            const levels = {
                STRONG: predictions.filter(p => p.confidence_level === 'STRONG').length,
                MEDIUM: predictions.filter(p => p.confidence_level === 'MEDIUM').length,
                WEAK: predictions.filter(p => p.confidence_level === 'WEAK').length
            };
            
            const confidenceCtx = document.getElementById('confidenceChart');
            if (confidenceCtx) {
                new Chart(confidenceCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['STRONG', 'MEDIUM', 'WEAK'],
                        datasets: [{
                            data: [levels.STRONG, levels.MEDIUM, levels.WEAK],
                            backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }
            
            // Action distribution
            const execute = predictions.filter(p => p.action === 'EXECUTE').length;
            const skip = predictions.filter(p => p.action === 'SKIP').length;
            
            const actionCtx = document.getElementById('actionChart');
            if (actionCtx) {
                new Chart(actionCtx, {
                    type: 'pie',
                    data: {
                        labels: ['実行', 'スキップ'],
                        datasets: [{
                            data: [execute, skip],
                            backgroundColor: ['#10b981', '#ef4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }
        }
        
        // Auto-refresh every 5 minutes
        loadDashboard();
        setInterval(loadDashboard, 300000);
    </script>
</body>
</html>
