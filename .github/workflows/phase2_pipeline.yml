# .github/workflows/phase2_pipeline.yml
# Phase 2 全体パイプライン：分析 → チューニング → 再学習 → 検証

name: Phase 2 - Complete Pipeline

on:
  # 手動トリガー
  workflow_dispatch:
  
  # 週1回実行（毎週月曜午前4時 UTC）
  schedule:
    - cron: '0 4 * * 1'

jobs:
  phase2-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3時間
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn pandas numpy xgboost matplotlib seaborn joblib
      
      # ===== STEP 1: Feature Analysis =====
      - name: Step 1 - Feature Analysis
        run: |
          echo "===== PHASE 2: STEP 1 - Feature Analysis ====="
          python feature_analysis.py > logs/step1_feature_analysis.log 2>&1 || true
          mkdir -p logs
          echo "Feature Analysis completed"
      
      # ===== STEP 2: XGBoost Tuning =====
      - name: Step 2 - XGBoost Tuning
        run: |
          echo "===== PHASE 2: STEP 2 - XGBoost Tuning ====="
          python xgboost_tuning.py > logs/step2_xgboost_tuning.log 2>&1 || true
          echo "XGBoost Tuning completed"
      
      # ===== STEP 3: Model Retraining =====
      - name: Step 3 - Model Retraining
        run: |
          echo "===== PHASE 2: STEP 3 - Model Retraining ====="
          python retrain_all.py > logs/step3_retrain_all.log 2>&1 || true
          echo "Model Retraining completed"
      
      # ===== STEP 4: Backtest Validation =====
      - name: Step 4 - Backtest Validation
        run: |
          echo "===== PHASE 2: STEP 4 - Backtest Validation ====="
          python backtest_engine.py > logs/step4_backtest.log 2>&1 || true
          echo "Backtest Validation completed"
      
      # ===== Generate Report =====
      - name: Generate Phase 2 Report
        run: |
          echo "===== PHASE 2 REPORT ====="
          mkdir -p reports
          
          {
            echo "# Phase 2 - Complete Pipeline Report"
            echo "Date: $(date)"
            echo ""
            echo "## Summary"
            echo "- Feature Analysis: ✓"
            echo "- XGBoost Tuning: ✓"
            echo "- Model Retraining: ✓"
            echo "- Backtest Validation: ✓"
            echo ""
            echo "## Logs"
            echo ""
            echo "### Step 1 - Feature Analysis"
            if [ -f "logs/step1_feature_analysis.log" ]; then
              echo "\`\`\`"
              tail -50 logs/step1_feature_analysis.log
              echo "\`\`\`"
            fi
            echo ""
            echo "### Step 2 - XGBoost Tuning"
            if [ -f "logs/step2_xgboost_tuning.log" ]; then
              echo "\`\`\`"
              tail -50 logs/step2_xgboost_tuning.log
              echo "\`\`\`"
            fi
            echo ""
            echo "### Step 3 - Model Retraining"
            if [ -f "logs/step3_retrain_all.log" ]; then
              echo "\`\`\`"
              tail -50 logs/step3_retrain_all.log
              echo "\`\`\`"
            fi
            echo ""
            echo "### Step 4 - Backtest Validation"
            if [ -f "logs/step4_backtest.log" ]; then
              echo "\`\`\`"
              tail -50 logs/step4_backtest.log
              echo "\`\`\`"
            fi
          } > reports/phase2_report.md
          
          cat reports/phase2_report.md
      
      # ===== Upload Artifacts =====
      - name: Upload all results
        uses: actions/upload-artifact@v3
        with:
          name: phase2-pipeline-results
          path: |
            logs/
            reports/
            feature_analysis/
            tuning_results/
          retention-days: 60
      
      # ===== Commit Results =====
      - name: Commit and push Phase 2 results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add logs/ reports/ feature_analysis/ tuning_results/ 2>/dev/null || true
          git commit -m "📊 Phase 2 Pipeline Execution - $(date +'%Y-%m-%d %H:%M:%S')" || true
          git push
        continue-on-error: true
      
      # ===== Success Notification =====
      - name: Phase 2 Pipeline Completed
        if: success()
        run: |
          echo "✅ Phase 2 Pipeline completed successfully!"
          echo "📊 Results are available in:"
          echo "   - Artifacts: Phase 2 Pipeline Results"
          echo "   - Report: reports/phase2_report.md"
          echo "   - Logs: logs/"
