name: Codex Autofix CI

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  codex-autofix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ここでエラーを誘発する
      # utils/autofix_test.py に SyntaxError を入れておくことで意図的に failure を発生させる
      - name: Run safety test script
        run: python utils/autofix_test.py
        continue-on-error: true

      # Node 環境（Codex CLI 用）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      # Codex Autofix 実行
      - name: Run Codex Autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex autofix \
            --prompt-file ".github/codex-autofix-policy.txt" \
            --max-changes 80 \
            --max-files 3 \
            --explain \
            --commit-message "Codex Autofix: Fix CI failure"
