# .github/workflows/phase2_pipeline.yml
# Phase 2 全体パイプライン：分析 → チューニング → 再学習 → 検証

name: Phase 2 - Complete Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: suzumebachi-model-results
  cancel-in-progress: false

jobs:
  phase2-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Create logs directory
        run: mkdir -p logs reports

      - name: Verify leakage safeguards
        run: python -m pytest tests/test_xgboost_tuning.py

      # ===== STEP 1: Feature Analysis =====
      - name: Step 1 - Feature Analysis
        run: |
          echo "===== PHASE 2: STEP 1 - Feature Analysis ====="
          python feature_analysis.py 2>&1 | tee logs/step1_feature_analysis.log
          echo "✅ Feature Analysis completed"

      # ===== STEP 2: XGBoost Tuning =====
      - name: Step 2 - XGBoost Tuning
        run: |
          echo "===== PHASE 2: STEP 2 - XGBoost Tuning ====="
          python xgboost_tuning.py 2>&1 | tee logs/step2_xgboost_tuning.log
          echo "✅ XGBoost Tuning completed"

      # ===== STEP 3: Model Retraining =====
      - name: Step 3 - Model Retraining
        run: |
          echo "===== PHASE 2: STEP 3 - Model Retraining ====="
          python retrain_all.py 2>&1 | tee logs/step3_retrain_all.log
          echo "✅ Model Retraining completed"

      # ===== STEP 4: Backtest Validation =====
      - name: Step 4 - Backtest Validation
        run: |
          echo "===== PHASE 2: STEP 4 - Backtest Validation ====="
          python backtest_engine.py 2>&1 | tee logs/step4_backtest.log
          echo "✅ Backtest Validation completed"

      # ===== Generate Report =====
      - name: Generate Phase 2 Report
        run: |
          echo "===== GENERATING PHASE 2 REPORT ====="

          {
            echo "# Phase 2 - Complete Pipeline Report"
            echo ""
            echo "**Execution Date:** $(date)"
            echo ""
            echo "## Pipeline Status"
            echo "- ✅ Feature Analysis"
            echo "- ✅ XGBoost Tuning"
            echo "- ✅ Model Retraining"
            echo "- ✅ Backtest Validation"
            echo ""
            echo "## Execution Logs"
            echo ""

            if [ -f "logs/step1_feature_analysis.log" ]; then
              echo "### Step 1 - Feature Analysis"
              echo "\`\`\`"
              tail -30 logs/step1_feature_analysis.log
              echo "\`\`\`"
              echo ""
            fi

            if [ -f "logs/step2_xgboost_tuning.log" ]; then
              echo "### Step 2 - XGBoost Tuning"
              echo "\`\`\`"
              tail -30 logs/step2_xgboost_tuning.log
              echo "\`\`\`"
              echo ""
            fi

            if [ -f "logs/step3_retrain_all.log" ]; then
              echo "### Step 3 - Model Retraining"
              echo "\`\`\`"
              tail -30 logs/step3_retrain_all.log
              echo "\`\`\`"
              echo ""
            fi

            if [ -f "logs/step4_backtest.log" ]; then
              echo "### Step 4 - Backtest Validation"
              echo "\`\`\`"
              tail -30 logs/step4_backtest.log
              echo "\`\`\`"
              echo ""
            fi

            echo "---"
            echo "_Report generated automatically by GitHub Actions_"
          } > reports/phase2_report.md

          echo "✅ Report generated: reports/phase2_report.md"

      - name: Display Report
        run: cat reports/phase2_report.md

      - name: Commit and push results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          for path in logs reports feature_analysis tuning_results backtest_results retraining_results.csv retraining_results.json; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "📊 Phase 2 Pipeline Execution - $(date +'%Y-%m-%d %H:%M:%S')"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Pipeline Completed
        run: |
          echo "=========================================="
          echo "✅ Phase 2 Pipeline Execution Complete"
          echo "=========================================="
          echo "Execution Time: $(date)"
          echo "Results: reports/phase2_report.md, logs/, feature_analysis/, tuning_results/"
