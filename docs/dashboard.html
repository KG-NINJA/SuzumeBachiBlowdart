<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuzumeBachiBlowdart Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 36px;
        }
        
        .timestamp {
            color: #666;
            font-size: 14px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
            transition: transform 0.2s;
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
        }
        
        .summary-card.execute {
            border-left-color: #10b981;
        }
        
        .summary-card.skip {
            border-left-color: #ef4444;
        }
        
        .summary-card.best {
            border-left-color: #f59e0b;
        }
        
        .summary-card h3 {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .summary-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .summary-subtext {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .section-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-top: 40px;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        
        .trades-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }
        
        .trade-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #10b981;
            transition: transform 0.2s;
        }
        
        .trade-card:hover {
            transform: translateY(-5px);
        }
        
        .trade-card.skip {
            border-top-color: #ef4444;
            opacity: 0.7;
        }
        
        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 12px;
        }
        
        .ticker {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        
        .direction {
            font-size: 18px;
            font-weight: bold;
        }
        
        .direction.bullish {
            color: #10b981;
        }
        
        .direction.bearish {
            color: #ef4444;
        }
        
        .trade-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 12px 0;
        }
        
        .metric {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
        }
        
        .metric-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        .metric-value {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        
        .action-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 12px;
            background: #d1fae5;
            color: #065f46;
        }
        
        .action-badge.skip {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 25px 0;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .chart-wrapper {
            position: relative;
            height: 350px;
            margin-bottom: 20px;
        }
        
        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 30px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        
        th:last-child {
            border-right: none;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            color: #333;
            font-size: 14px;
        }
        
        tbody tr {
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: #f9fafb;
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        .rank {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }
        
        .accuracy-high {
            color: #10b981;
            font-weight: bold;
        }
        
        .accuracy-medium {
            color: #f59e0b;
            font-weight: bold;
        }
        
        .accuracy-low {
            color: #ef4444;
            font-weight: bold;
        }
        
        .confidence-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .confidence-strong {
            background: #d1fae5;
            color: #065f46;
        }
        
        .confidence-medium {
            background: #fef3c7;
            color: #92400e;
        }
        
        .confidence-weak {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            padding: 30px;
            border-top: 2px solid rgba(255,255,255,0.2);
        }
        
        .tweet-button {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 20px;
            background: #1DA1F2;
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .tweet-button:hover {
            background: #1a8cd8;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 20px;
            padding: 40px;
        }
        
        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .trades-container {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 SuzumeBachiBlowdart Dashboard</h1>
            <p class="timestamp">Last Update: <span id="lastUpdate">Loading...</span></p>
        </header>
        
        <div id="content">
            <div class="loading">📊 Loading data...</div>
        </div>
    </div>

    <script>
        function tweetDashboard() {
            const execute = document.querySelector('.summary-card.execute .summary-value')?.textContent || '8';
            const skip = document.querySelector('.summary-card.skip .summary-value')?.textContent || '2';
            const best = document.querySelector('.summary-card.best .summary-value')?.textContent || '1';
            
            const text = `🚀 SuzumeBachiBlowdart Daily Prediction Report

📊 Total Predictions: 10
✅ Recommended Actions: ${execute}
⏸️ Skip: ${skip}
⭐ High Quality: ${best}

Automated AI-powered stock price prediction system.
Daily updated with Phase 1-3 analysis.

🔗 Dashboard: https://kg-ninja.github.io/SuzumeBachiBlowdart/dashboard.html

#KGNINJA #SuzumeBachiBlowdart #Stockprediction #AI #Trading`;
            
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank', 'width=550,height=420');
        }
        
        async function loadDashboard() {
            try {
                const response = await fetch('./data/latest_predictions.json');
                const predictions = await response.json();
                
                let backtest = null;
                try {
                    const backtestResponse = await fetch('./data/backtest_report.json');
                    if (backtestResponse.ok) {
                        backtest = await backtestResponse.json();
                    }
                } catch (e) {
                    console.log('Backtest data not available');
                }
                
                renderDashboard(predictions, backtest);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('content').innerHTML = 
                    '<div class="loading" style="color: #ff6b6b;">❌ Error loading data</div>';
            }
        }
        
        function renderDashboard(predictions, backtest) {
            const execute = predictions.filter(p => p.action === 'EXECUTE');
            const skip = predictions.filter(p => p.action === 'SKIP');
            
            let best = 0, good = 0;
            if (backtest && backtest.trade_categories) {
                best = backtest.trade_categories.best_count || 0;
                good = backtest.trade_categories.good_count || 0;
            }
            
            const avgConfidence = (predictions.reduce((sum, p) => sum + p.confidence, 0) / predictions.length * 100).toFixed(2);
            const avgAccuracy = (predictions.reduce((sum, p) => sum + p.model_accuracy, 0) / predictions.length * 100).toFixed(2);
            
            let html = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <h3>📊 Total Predictions</h3>
                        <div class="summary-value">${predictions.length}</div>
                        <div class="summary-subtext">10 stocks analyzed</div>
                    </div>
                    
                    <div class="summary-card execute">
                        <h3>✅ Recommended</h3>
                        <div class="summary-value">${execute.length}</div>
                        <div class="summary-subtext">${(execute.length/predictions.length*100).toFixed(0)}% high confidence</div>
                    </div>
                    
                    <div class="summary-card skip">
                        <h3>⏸️ Skip</h3>
                        <div class="summary-value">${skip.length}</div>
                        <div class="summary-subtext">${(skip.length/predictions.length*100).toFixed(0)}% low confidence</div>
                    </div>
                    
                    <div class="summary-card best">
                        <h3>⭐ High Quality</h3>
                        <div class="summary-value">${best}</div>
                        <div class="summary-subtext">BEST trades</div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>📈 Avg Confidence</h3>
                        <div class="summary-value">${avgConfidence}%</div>
                        <div class="summary-subtext">Signal strength</div>
                    </div>
                    
                    <div class="summary-card">
                        <h3>🎯 Avg Accuracy</h3>
                        <div class="summary-value">${avgAccuracy}%</div>
                        <div class="summary-subtext">Model accuracy</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">📊 Accuracy Distribution by Ticker</div>
                    <div class="chart-wrapper"><canvas id="accuracyChart"></canvas></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">💡 Confidence Level Distribution</div>
                    <div class="chart-wrapper"><canvas id="confidenceChart"></canvas></div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">🎲 Action Distribution</div>
                    <div class="chart-wrapper"><canvas id="actionChart"></canvas></div>
                </div>
                
                <div class="section-title">🟢 Recommended Trades (High Confidence)</div>
            `;
            
            if (execute.length > 0) {
                html += '<div class="trades-container">';
                execute.forEach(pred => {
                    const direction = pred.direction.includes('Bullish') ? 'bullish' : 'bearish';
                    const directionText = direction === 'bullish' ? '📈 BULLISH' : '📉 BEARISH';
                    html += `
                        <div class="trade-card">
                            <div class="trade-header">
                                <span class="ticker">${pred.ticker}</span>
                                <span class="direction ${direction}">${directionText}</span>
                            </div>
                            <div class="trade-metrics">
                                <div class="metric">
                                    <div class="metric-label">Confidence</div>
                                    <div class="metric-value">${(pred.confidence * 100).toFixed(1)}%</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Accuracy</div>
                                    <div class="metric-value">${(pred.model_accuracy * 100).toFixed(1)}%</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Current</div>
                                    <div class="metric-value">$${pred.current_price.toFixed(2)}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Target</div>
                                    <div class="metric-value">$${pred.predicted_price.toFixed(2)}</div>
                                </div>
                            </div>
                            <span class="action-badge">✅ EXECUTE</span>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += '<p style="color: #666; text-align: center; margin: 30px 0;">No high-confidence signals at this time</p>';
            }
            
            html += `
                <div class="section-title">📊 Complete Rankings</div>
                <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Ticker</th>
                            <th>Direction</th>
                            <th>Confidence</th>
                            <th>Accuracy</th>
                            <th>Current Price</th>
                            <th>Target Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            predictions.sort((a, b) => b.model_accuracy - a.model_accuracy).forEach((pred, idx) => {
                const direction = pred.direction.includes('Bullish') ? '📈' : '📉';
                const directionText = pred.direction.includes('Bullish') ? 'BULLISH' : 'BEARISH';
                
                let accuracyClass = 'accuracy-low';
                if (pred.model_accuracy > 0.65) accuracyClass = 'accuracy-high';
                else if (pred.model_accuracy > 0.55) accuracyClass = 'accuracy-medium';
                
                let confidenceClass = 'confidence-weak';
                if (pred.confidence_level === 'STRONG') confidenceClass = 'confidence-strong';
                else if (pred.confidence_level === 'MEDIUM') confidenceClass = 'confidence-medium';
                
                const action = pred.action === 'EXECUTE' ? '✅ EXECUTE' : '⏸️ SKIP';
                
                html += `
                    <tr>
                        <td><span class="rank">#${idx + 1}</span></td>
                        <td><strong>${pred.ticker}</strong></td>
                        <td>${direction} ${directionText}</td>
                        <td><span class="confidence-badge ${confidenceClass}">${(pred.confidence * 100).toFixed(1)}%</span></td>
                        <td><span class="${accuracyClass}">${(pred.model_accuracy * 100).toFixed(1)}%</span></td>
                        <td>$${pred.current_price.toFixed(2)}</td>
                        <td>$${pred.predicted_price.toFixed(2)}</td>
                        <td>${action}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
                </div>
                
                <div class="footer">
                    <p>🚀 SuzumeBachiBlowdart - Automated Trading Prediction System</p>
                    <p>Phase 1: Confidence Filter | Phase 2: Market Analysis | Phase 3: Backtest</p>
                    <button onclick="tweetDashboard()" class="tweet-button">
                        🐦 Share on Twitter
                    </button>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('en-US');
            
            createCharts(predictions);
        }
        
        function createCharts(predictions) {
            const accuracyCtx = document.getElementById('accuracyChart');
            if (accuracyCtx) {
                new Chart(accuracyCtx, {
                    type: 'bar',
                    data: {
                        labels: predictions.map(p => p.ticker),
                        datasets: [{
                            label: 'Model Accuracy',
                            data: predictions.map(p => p.model_accuracy * 100),
                            backgroundColor: predictions.map(p => {
                                if (p.model_accuracy > 0.65) return '#10b981';
                                if (p.model_accuracy > 0.55) return '#f59e0b';
                                return '#ef4444';
                            }),
                            borderRadius: 8,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, max: 100, ticks: { stepSize: 20 } }
                        }
                    }
                });
            }
            
            const levels = {
                STRONG: predictions.filter(p => p.confidence_level === 'STRONG').length,
                MEDIUM: predictions.filter(p => p.confidence_level === 'MEDIUM').length,
                WEAK: predictions.filter(p => p.confidence_level === 'WEAK').length
            };
            
            const confidenceCtx = document.getElementById('confidenceChart');
            if (confidenceCtx) {
                new Chart(confidenceCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['STRONG', 'MEDIUM', 'WEAK'],
                        datasets: [{
                            data: [levels.STRONG, levels.MEDIUM, levels.WEAK],
                            backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }
            
            const execute = predictions.filter(p => p.action === 'EXECUTE').length;
            const skip = predictions.filter(p => p.action === 'SKIP').length;
            
            const actionCtx = document.getElementById('actionChart');
            if (actionCtx) {
                new Chart(actionCtx, {
                    type: 'pie',
                    data: {
                        labels: ['EXECUTE', 'SKIP'],
                        datasets: [{
                            data: [execute, skip],
                            backgroundColor: ['#10b981', '#ef4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }
        }
        
        loadDashboard();
        setInterval(loadDashboard, 300000);
    </script>
</body>
</html>
