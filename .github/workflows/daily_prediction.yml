name: Daily Stock Prediction

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      REQUEST_UA: "Mozilla/5.0 (Codex-GitHubRunner)"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline safety tests
      run: python -m unittest discover -s tests -p 'test_pipeline_safety.py' -v

    - name: Run prediction
      id: prediction
      continue-on-error: true
      run: python simple_daily_prediction.py
      env:
        PYTHONUNBUFFERED: 1

    - name: Commit and push results
      if: always() && steps.prediction.outcome != 'skipped'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "Update predictions: $(date)" || echo "No changes to commit"
        git push

    - name: Mark failed prediction pipeline
      if: steps.prediction.outcome == 'failure'
      run: |
        echo "Prediction pipeline failed after writing diagnostics."
        cat daily_predictions/run_diagnostics.json || true
        exit 1
