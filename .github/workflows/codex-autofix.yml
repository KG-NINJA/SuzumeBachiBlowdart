name: Codex Auto-Fix on Failure

on:
  workflow_run:
    # ここを「監視したいメインCIの名前」に合わせる
    # Actions の左メニューに出ている "Phase 2 - Complete Pipeline" など。
    workflows: ["Phase 2 - Complete Pipeline"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    # 失敗したときだけ動く
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check OPENAI_API_KEY
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not set. Skipping auto-fix." >&2
            exit 1
          fi

      - name: Checkout failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAILED_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install --upgrade pip
            pip install -r requirements.txt
          fi

      # ★ ここが Codex 本体。CLI ではなく Action を使うのが正解。
      - name: Run Codex autofix
        uses: openai/codex-action@main
        id: codex
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # ここに「Allowed / Forbidden」を全部書き込む
          prompt: >-
            You are the CI autofix agent for the SuzumeBachiBlowdart repository.
            This is a Python-based stock prediction system with GitHub Actions pipelines.
            Your job is to read the repository and the existing CI configuration,
            reproduce the failing CI step, and implement the *minimal* change required
            to make CI pass again.

            Strict rules:
            - DO NOT change core model logic or training algorithms.
            - DO NOT modify any files under data/, datasets/, or models/.
            - You MAY fix syntax errors, import issues, path bugs, and small plumbing issues.
            - Keep changes under ~80 lines total and in at most 3 files.
            - Avoid refactors, new features, or broad code rewrites.
            - Prefer small, surgical fixes that mirror what an experienced engineer would do.

            After implementing the fix, rerun the same command that failed in the CI
            to ensure it passes before finishing.

          # Codex をワークスペース書き込みモードで動かすガード
          codex_args: '["--config","sandbox_mode=\"workspace-write\""]'

      # Codex が直したあとに、自分でもう一度パイプラインを確認したい場合はここを書き換える
      # 実際に Phase 2 の CI で使っているコマンドに合わせてください。
      - name: Verify pipeline (optional, adjust to your CI command)
        run: |
          echo "TODO: replace this with the same command your CI runs, e.g.:"
          echo "python scripts/run_full_pipeline.py"
          # 例:
          # python scripts/run_full_pipeline.py

      - name: Create pull request with fixes
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(ci): auto-fix failing CI via Codex"
          branch: codex/auto-fix-${{ github.event.workflow_run.run_id }}
          base: ${{ env.FAILED_HEAD_BRANCH }}
          title: "Auto-fix failing CI via Codex"
          body: |
            Codex automatically generated this PR in response to a CI failure
            on workflow `${{ env.FAILED_WORKFLOW_NAME }}`.

            Failed run: ${{ env.FAILED_RUN_URL }}
            Head branch: `${{ env.FAILED_HEAD_BRANCH }}`

            Changes are intended to be minimal and focused solely on fixing the CI.
